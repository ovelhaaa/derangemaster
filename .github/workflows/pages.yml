name: Deploy WASM Lab to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.62'
      - name: Build WASM Module
        run: |
          emcmake cmake -B build-wasm -DRANGEMASTER_BUILD_WASM=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j4
          mkdir -p web/src/wasm web/public/wasm
          cp build-wasm/rangemaster_dsp.js web/src/wasm/rangemaster_dsp.js
          cp build-wasm/rangemaster_dsp.wasm web/src/wasm/rangemaster_dsp.wasm
          cp build-wasm/rangemaster_dsp.wasm web/public/wasm/rangemaster_dsp.wasm
      - name: Build Production Bundle for /derangemaster/
        env:
          VITE_BASE_PATH: /derangemaster/
        run: cd web && npm ci && npm run typecheck && npm run build
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
