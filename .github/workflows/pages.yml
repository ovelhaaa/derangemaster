name: Deploy WASM Lab to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.62'
      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build WASM Module
        run: |
          emcmake cmake -B build-wasm -DRANGEMASTER_BUILD_WASM=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j4
          emcc --version > build-wasm/emscripten-version.txt
          mkdir -p web/src/wasm web/public/wasm
          cp build-wasm/rangemaster_dsp.js web/src/wasm/rangemaster_dsp.js
          cp build-wasm/rangemaster_dsp.wasm web/public/wasm/rangemaster_dsp.wasm
          node web/scripts/stamp-wasm.mjs
      - name: Build Production Bundle for GitHub Pages
        run: |
          RAW_BASE="${{ steps.pages.outputs.base_path }}"
          if [ -z "$RAW_BASE" ]; then
            RAW_BASE="/derangemaster"
          fi
          case "$RAW_BASE" in
            */) VITE_BASE="$RAW_BASE" ;;
            *)  VITE_BASE="${RAW_BASE}/" ;;
          esac
          echo "Using VITE_BASE_PATH=$VITE_BASE"
          cd web
          npm ci
          VITE_BASE_PATH="$VITE_BASE" npm run typecheck
          VITE_BASE_PATH="$VITE_BASE" npm run build
          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/wasm/rangemaster_dsp.wasm
          test -f dist/worklet/rangemaster-processor.js
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
