name: WASM & Web Lab CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  wasm-and-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.62'
      - name: Build Native Renderer for Equivalence Check
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DRANGEMASTER_BUILD_TESTS=OFF
          cmake --build build --target rangemaster-render -j4
          ln -sf rangemaster-render build/rangemaster-render.exe
      - name: Build WASM Module
        run: |
          emcmake cmake -B build-wasm -DRANGEMASTER_BUILD_WASM=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j4
          emcc --version > build-wasm/emscripten-version.txt
      - name: Verify Native/WASM Numerical Equivalence
        run: node tools/analysis/test_wasm_equivalence.mjs
      - name: Sync WASM to Web App & Build
        run: |
          mkdir -p web/src/wasm web/public/wasm
          cp build-wasm/rangemaster_dsp.js web/src/wasm/rangemaster_dsp.js
          cp build-wasm/rangemaster_dsp.wasm web/public/wasm/rangemaster_dsp.wasm
          node web/scripts/stamp-wasm.mjs
          cd web && npm ci && npm run typecheck && npm run build && npm test
      - name: Browser Qualification
        run: |
          cd web
          npx playwright install --with-deps chromium firefox
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=derangemaster rate=48000
          pactl set-default-sink derangemaster
          npm run test:browser
